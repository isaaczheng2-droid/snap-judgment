<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
<style>
  /* ============ retro forecast theme ============
     The whole site as a late-80s cable weather channel: a dusk gradient from deep blue down
     to orange, boxed blue panels with a light rule, chunky terminal type with a hard black
     shadow, yellow for headings and anything you can press. One fixed theme, light or dark
     system setting alike. Loaded last, so it restyles through the existing tokens and leaves
     every number-producing component alone. */
  :root:root:root {
    color-scheme: dark;
    --bg: #1b2a72;
    --surface: #263a86;
    --surface-alt: #2f4698;
    --surface-sunk: #1a2867;
    --border: #5d74c4;
    --border-strong: #9fb0ea;
    --ink: #ffffff;
    --ink-2: #e6eaff;
    --ink-3: #c6cef5;
    --ink-4: #b3bdec;
    --on-ink: #14215c;
    --accent: #ffd94a;
    --accent-ink: #ffe27a;
    --accent-soft: #46518f;
    --link: #ffe27a;
    --amber: #ffb44a;
    --amber-soft: #5b4a72;
    --pos: #7be495;
    --pos-soft: #1f5b55;
    --neg: #ff9a8a;
    --neg-soft: #6b3058;
    --warn: #ffd27a;
    --warn-soft: #5b4a72;
    --series-1: #ffd94a;
    --series-2: #ff9a4a;
    --series-3: #8fd3ff;
    --seq-a: #34509a;
    --seq-b: #4f7fc0;
    --seq-c: #7fc0e0;
    --seq-d: #e8f6ff;
    --hairline: rgba(255, 255, 255, 0.14);
    --rule: rgba(255, 255, 255, 0.6);
    --shadow: 3px 3px 0 rgba(0, 0, 0, 0.4);
    --display: "VT323", "Lucida Console", "Courier New", monospace;
    --board-accent: #ffd94a;
    --radius: 2px;
    --radius-lg: 3px;
  }
  html body {
    background: #1b2a72 linear-gradient(180deg, #14226a 0%, #24338c 32%, #4a3f96 58%, #9a5a7c 80%, #e08a3c 100%) fixed;
    color: var(--ink);
  }
  body::before { opacity: .3 !important; }
  .appbar { background: linear-gradient(90deg, #e08a3c 0%, #8a4f96 38%, #24338c 100%) !important; border-bottom: 2px solid #fff !important; }
  .wordmark { font-size: 30px !important; font-weight: 400 !important; letter-spacing: .04em; color: #fff; text-shadow: 2px 2px 0 #000; }
  .navlink { font-size: 18px !important; padding: 0 6px !important; font-weight: 400 !important; color: #fff !important; text-shadow: 1px 1px 0 #000; }
  .navlink[aria-current] { color: var(--accent) !important; }
  h1, h2, h3, h4 { text-shadow: 2px 2px 0 rgba(0, 0, 0, .55); font-weight: 400 !important; letter-spacing: .02em; }
  .page-head h1 { font-size: 46px !important; color: var(--accent); }
  .page-head { border-bottom-color: #fff !important; }
  .hsec h2, .card h3, .cbox h4, .whybox h4 { color: var(--accent); font-size: 26px !important; }
  .bottomnav { background: #14226a !important; border-top: 2px solid #fff !important; }
  :focus-visible { outline-color: var(--accent) !important; }

  /* ---- players bursting out of the top of the page ---- */
  .tb-banner { position: relative; height: clamp(180px, 30vw, 340px); margin: 4px 0 2px; isolation: isolate; pointer-events: none; overflow-x: clip;
    clip-path: inset(-80px 0 0 0); /* cutouts may rise above the box, never spill below or sideways onto the page */ }
  .tb-banner .shapes { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; }
  .tb-banner .pl { position: absolute; bottom: 0; left: var(--x); height: var(--h); width: auto; max-width: none; z-index: var(--z);
    transform: translateX(-50%) rotate(var(--r)); transform-origin: 50% 100%; }
  .tb-banner.nfl .pl { filter: saturate(1.25) contrast(1.1) drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 -2px 0 #fff); }
  .tb-banner.nba .pl { filter: saturate(1.3) contrast(1.08) drop-shadow(4px 0 0 #36e0c6) drop-shadow(-4px 0 0 #ff3d7f); }
  .tb-banner .art { position: absolute; left: 50%; bottom: 0; height: 112%; width: auto; max-width: 100%; object-fit: contain; object-position: 50% 100%;
    transform: translateX(-50%); filter: drop-shadow(0 0 0 #000) drop-shadow(5px 6px 0 rgba(0, 0, 0, .4)); }
  @media (max-width: 620px) { .tb-banner .pl:nth-of-type(n+6) { display: none; } }
  @media (prefers-reduced-motion: no-preference) {
    .tb-banner .pl { animation: tb-pop .55s cubic-bezier(.2, 1.5, .4, 1) both; animation-delay: var(--d); }
    .tb-banner .art { animation: tb-rise .6s cubic-bezier(.2, 1.3, .4, 1) both; }
    .tb-banner .shapes > * { animation: tb-burst .5s ease-out both; transform-origin: 500px 300px; }
  }
  @keyframes tb-pop { from { transform: translateX(-50%) translateY(35%) scale(.3) rotate(0deg); opacity: 0; } }
  @keyframes tb-rise { from { transform: translateX(-50%) translateY(30%) scale(.7); opacity: 0; } }
  @keyframes tb-burst { from { transform: scale(.2); opacity: 0; } }

  /* ---- the forecast: a title bar with the clock, then one boxed card per game ---- */
  .wx-bar { display: flex; justify-content: space-between; align-items: end; gap: 16px; padding: 6px 2px 10px; border-bottom: 2px solid #fff; margin-bottom: 14px;
    font-family: var(--display); text-shadow: 2px 2px 0 #000; }
  .wx-bar h1 { margin: 0; font-size: clamp(34px, 5vw, 48px) !important; line-height: .86; color: var(--accent); text-transform: none; }
  .wx-clock { text-align: right; font-size: clamp(20px, 2.6vw, 26px); line-height: 1; color: #fff; text-transform: uppercase; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .wx-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(178px, 1fr)); gap: 12px; }
  .wx-card { display: grid; justify-items: center; align-content: start; text-align: center; color: #fff; text-decoration: none; font-family: var(--display);
    border: 2px solid #dfe6ff; background: linear-gradient(180deg, #4a74e6 0%, #2f4fc4 50%, #1b3193 100%); box-shadow: 4px 4px 0 rgba(0, 0, 0, .45);
    text-shadow: 2px 2px 0 rgba(0, 0, 0, .7); transition: transform .12s ease-out, box-shadow .12s ease-out; }
  .wx-card:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 rgba(0, 0, 0, .45); }
  .wx-card:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 rgba(0, 0, 0, .45); }
  .wx-card:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .wx-day { width: 100%; padding: 1px 6px 2px; background: #14215c; color: var(--accent); font-size: 23px; letter-spacing: .04em; text-transform: uppercase; border-bottom: 2px solid #dfe6ff; }
  .wx-card .tlogo { width: 66px; height: 66px; margin: 10px 0 0; filter: drop-shadow(3px 3px 0 rgba(0, 0, 0, .4)); }
  .wx-pick { font-size: 28px; line-height: 1; margin-top: 2px; }
  .wx-pct { font-size: 50px; line-height: .9; font-variant-numeric: tabular-nums; }
  .wx-match { font-size: 20px; color: #dfe6ff; margin: 2px 0 6px; }
  .wx-st { font-size: 19px; line-height: 1.05; padding: 0 6px 6px; min-height: 26px; }
  .wx-st.ok { color: #9af0ac; } .wx-st.miss { color: #ffb3a6; } .wx-st.pend { color: #dfe6ff; }
  .wx-lohi { width: 100%; display: grid; grid-template-columns: 1fr 1fr; margin-top: auto; background: #101c5a; border-top: 2px solid #dfe6ff; font-size: 22px; line-height: 1.05; padding: 3px 0 4px; font-variant-numeric: tabular-nums; }
  .wx-lohi b { display: block; font-weight: 400; color: var(--accent); }
  .wx-changes { margin-top: 26px; }
  #panel-nba > .page-head { display: none; }
  .intro-enter:focus-visible { outline-color: rgba(248, 244, 234, .45) !important; }
  @media (max-width: 620px) {
    .wx-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
    .wx-day { font-size: 19px; } .wx-pct { font-size: 42px; } .wx-card .tlogo { width: 54px; height: 54px; }
  }
  .badge.conf.high { color: var(--on-ink) !important; }
  /* the matchup scoreboard was ink-on-paper; here it is a dark board with the score in yellow */
  .mprob { background: #101c5a !important; border: 2px solid #dfe6ff; }
  .mprob, .mprob * { color: #fff !important; }
  .mprob .score { color: var(--accent) !important; }

  /* ---- every inner page in the same broadcast dress ----
     The section pages (Games, Fantasy, Players, Props, Model Performance, About and the NBA
     tabs) are built from a handful of shared pieces. Each gets the forecast-card treatment:
     a square box with a light rule and a hard shadow on a blue gradient, a dark title strip
     with yellow terminal type, and square controls. Boxes inside boxes go flat and dark so
     the frame is only drawn once. */
  :root:root:root { --radius: 0px; --radius-lg: 0px; }
  :is(.card, .cbox, .gcard, .pcard, .propcard, .tile, .fact, .box, .pb, .pick, .state, .purpose, .ustrip, .slate, .ftable, .fstrip, .whybox, .tip, .note, .warn, .perfbox, .upd, .topedge, details.more, details.filterbar) {
    border: 2px solid #dfe6ff !important; border-radius: 0 !important;
    background: linear-gradient(180deg, #3a5fd2 0%, #2a45ab 55%, #1b3193 100%) !important;
    box-shadow: 4px 4px 0 rgba(0, 0, 0, .45) !important;
  }
  :is(.card, .cbox, .gcard, .pcard, .propcard, .tile, .pick, .state, .purpose, .ustrip, .slate, .ftable, .whybox, .perfbox, details.more, details.filterbar)
    :is(.card, .cbox, .tile, .fact, .box, .pb, .pick, .state, .tip, .note, .warn, .upd, .whybox, details.more) {
    border-width: 1px !important; background: #14226a !important; box-shadow: none !important;
  }
  .warn, .note { border-left: 6px solid var(--amber) !important; }
  a:is(.gcard, .pcard, .propcard, .topedge), .gcard, .pcard { transition: transform .12s ease-out, box-shadow .12s ease-out; }
  a:is(.gcard, .pcard, .propcard, .topedge):hover, .gcard:hover, .pcard:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 rgba(0, 0, 0, .45) !important; }

  /* title strips and tab rows */
  .card h3, .cbox h4, .whybox h4, .hsec h2, details.more > summary {
    font-family: var(--display); color: var(--accent); text-transform: uppercase; letter-spacing: .04em; }
  .cbox h4, .whybox h4, .card h3 { margin: -1px -1px 12px !important; padding: 2px 10px 3px !important; background: #101c5a; border-bottom: 2px solid #dfe6ff !important; }
  .page-head .sub, .page-head .stamp { text-shadow: 1px 1px 0 rgba(0, 0, 0, .5); }
  .subnav { border-bottom: 2px solid #fff !important; }
  .subnav a { font-family: var(--display) !important; font-size: 21px !important; font-weight: 400 !important; text-transform: uppercase; letter-spacing: .03em; color: #fff !important; text-shadow: 1px 1px 0 #000; }
  .subnav a[aria-current] { color: var(--accent) !important; border-bottom-color: var(--accent) !important; }

  /* controls */
  .segmented, .sportsel { border: 2px solid #dfe6ff !important; border-radius: 0 !important; background: #101c5a !important; padding: 0 !important; overflow: hidden; }
  .seg, .sportsel a { font-family: var(--display) !important; font-size: 20px !important; font-weight: 400 !important; border-radius: 0 !important; color: #fff !important; letter-spacing: .04em; }
  .seg[aria-pressed="true"], .sportsel a[aria-current] { background: var(--accent) !important; color: #14215c !important; text-shadow: none; }
  .btn, .fbtn, .pf, .chk, .teamtab, .iconbtn, .week-badge, .uchip, select, .sel, .sortsel, input[type="search"], input[type="text"], input[type="number"], label.search, .search {
    border-radius: 0 !important; border: 2px solid #dfe6ff !important; background-color: #101c5a !important; color: #fff !important; }
  label.search input, .search input { border: 0 !important; background: transparent !important; }
  .btn.primary, :is(.pf, .chk, .teamtab, .fbtn)[aria-pressed="true"] { background: var(--accent) !important; color: #14215c !important; }
  .week-badge { font-family: var(--display) !important; font-size: 19px !important; letter-spacing: .05em; text-shadow: 1px 1px 0 #000; }
  .control-label { font-family: var(--display) !important; font-size: 18px !important; color: var(--accent) !important; }

  /* tables: a dark header band with yellow column names, light rules between rows */
  main table { border: 2px solid #dfe6ff; border-collapse: collapse; background: #1b3193; box-shadow: 4px 4px 0 rgba(0, 0, 0, .45); }
  :is(.card, .cbox, .ftable, details.more) table { box-shadow: none; }
  main th { background: #101c5a !important; color: var(--accent) !important; font-family: var(--display) !important; font-size: 19px !important; font-weight: 400 !important;
    text-transform: uppercase; letter-spacing: .04em; border-bottom: 2px solid #dfe6ff !important; }
  main tbody th { color: #fff !important; font-size: 18px !important; }
  main td { border-color: rgba(223, 230, 255, .3) !important; }
  main tbody tr:hover > * { background-color: rgba(255, 255, 255, .07); }

  /* chips and the big numbers */
  .badge, .gtag, .gbadge, .mbadge, .stat-badge, .fbadge, .fs, .fq { border-radius: 0 !important; font-family: var(--display) !important; font-size: 16px !important; line-height: 1.05 !important; letter-spacing: .05em; font-weight: 400 !important; }
  :is(.tile, .fact, .pb, .perfrow, .box) :is(.v, .val), .pv, .gp, .spick, .mprob .num { font-family: var(--display) !important; font-weight: 400 !important; text-shadow: 2px 2px 0 rgba(0, 0, 0, .55); }
  .rfoot { border-top: 2px solid #fff !important; }

  /* ---- one typeface everywhere ----
     Names, labels, table cells and prose all go to the terminal face, the way a real weather
     channel page was set. It draws small for its point size, so font-size-adjust scales it
     up to the x-height the old text face had and nothing needs re-measuring. Elements whose
     size was already chosen for this face opt back out. */
  :root:root:root { --body: var(--display); --mono: var(--display); }
  body { font-size-adjust: 0.5; letter-spacing: .01em; }
  h1, h2, h3, h4, .wordmark, .navlink, .week-badge, .subnav a, .seg, .sportsel a, .control-label, main th,
  .badge, .gtag, .gbadge, .mbadge, .stat-badge, .fbadge, .fs, .fq, .wx-bar, .wx-card, .intro-card, .intro-enter { font-size-adjust: none; }
  .intro-enter { font-size: 19px !important; }
  b, strong { font-weight: 400; color: #fff; text-shadow: 1px 0 0 currentColor; }   /* bold as a double strike, not a smeared synthetic weight */
  main p, main li, .fdetail, .sub { line-height: 1.35; }
  .week-badge { font-size: 17px !important; padding: 2px 8px !important; }
  .bottomnav a { font-size-adjust: none; font-size: 15px !important; }
  /* on a phone the NFL / NBA switch matters more than the week stamp */
  @media (max-width: 620px) { .week-badge { display: none !important; } }

  /* ---- roster & lineup: pixel players instead of photo cards ----
     Each spot on the field or court is a little sprite in the team's colours with the name
     ("D. Maye") under it, then the position and the Model Grade. No box behind them: the
     turf shows through, and a dark plate under the text keeps it readable on any stripe. */
  .pm { background: none !important; border: 0 !important; box-shadow: none !important; padding: 0 !important; border-radius: 0 !important;
    display: flex !important; flex-wrap: wrap; justify-content: center; align-items: center; gap: 2px 5px; width: 98px; min-height: 44px; cursor: pointer; }
  .pm .avatar.pix { order: 1; flex: 0 0 100% !important; display: block !important; width: 100% !important; height: 120px !important; min-width: 0; max-width: none; margin: 0; padding: 0; border: 0 !important; border-radius: 0 !important;
    background: none !important; box-shadow: none !important; overflow: visible; }
  .pm .avatar.pix svg { display: block; position: static; height: 120px; width: 60px; margin: 0 auto; shape-rendering: crispEdges; overflow: visible;
    filter: drop-shadow(1px 0 0 #000) drop-shadow(-1px 0 0 #000) drop-shadow(0 -1px 0 #000) drop-shadow(2px 3px 0 rgba(0, 0, 0, .5)); transition: transform .12s ease-out; }
  .pm:hover .avatar.pix svg, .pm:focus-visible .avatar.pix svg { transform: translateY(-4px); }
  .pm:focus-visible { outline: 3px solid var(--accent) !important; outline-offset: 2px; }
  .pm.role-backup .avatar.pix { opacity: .8; }
  .pm .pm-name { order: 2; flex: 0 0 auto; max-width: 100%; padding: 0 5px 1px; background: #101c5a; border: 1px solid #dfe6ff; color: #fff !important;
    font-family: var(--display) !important; font-size: 15px !important; font-size-adjust: none; line-height: 1.05; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pm .pm-pos { order: 3; flex: 0 0 auto; color: var(--accent) !important; font-family: var(--display) !important; font-size: 15px !important; font-size-adjust: none; line-height: 1;
    text-shadow: 1px 1px 0 #000, -1px 0 0 #000, 0 -1px 0 #000; }
  .pm .pm-grade { order: 4; position: static !important; transform: none !important; flex: 0 0 auto; min-width: 0; height: auto; padding: 0 4px 1px; border-radius: 0 !important; border: 1px solid #fff;
    font-family: var(--display) !important; font-size: 16px !important; font-size-adjust: none; line-height: 1.05; box-shadow: 1px 1px 0 #000; }
  .pm .pm-grade::before { content: "GR "; opacity: .85; }
  .pm::after { content: ""; order: 2; flex: 0 0 100%; height: 0; }                 /* line break after the name */
  .pm .pm-pos, .pm .pm-grade { display: inline-block !important; width: auto !important; margin: 0 !important; }
  .pm .pm-grade.na::before { content: ""; }
  /* on a phone the field and court are narrower, so every player is drawn smaller to keep them apart */
  @media (max-width: 700px) {
    .pm { width: 72px !important; gap: 1px 3px !important; }
    .pm:not([data-sport="nba"]) .avatar.pix { height: 58px !important; }
    .pm:not([data-sport="nba"]) .avatar.pix svg { height: 58px !important; width: 38px !important; }
    .pm[data-sport="nba"] .avatar.pix { height: 92px !important; }
    .pm[data-sport="nba"] .avatar.pix svg { height: 92px !important; width: 46px !important; }
    .pm .pm-name { font-size: 13px !important; padding: 0 3px 1px !important; }
    .pm .pm-pos { font-size: 12px !important; }
    .pm .pm-grade { font-size: 13px !important; padding: 0 3px 1px !important; }
  }
  /* the helmeted football sprite is shorter than a basketball bobblehead */
  .pm:not([data-sport="nba"]) .avatar.pix { height: 84px !important; }
  .pm:not([data-sport="nba"]) .avatar.pix svg { height: 84px; width: 54px; }
</style>
<script>
/* ====================== THEME: home forecast and the player banners ======================
   Replaces the home page's contents (the numbers still come from the same DATA and the same
   helpers) and puts a burst of player cutouts at the top of the NFL home page and the NBA
   section. The cutouts are the official background-free headshots already in the data; an
   image at media/banner/nfl.png or media/banner/nba.png (a transparent PNG) replaces them. */
(function () {
  const SLOTS = [[50, 108, 0, 7], [35, 94, -6, 6], [65, 94, 6, 6], [21, 80, -11, 5], [79, 80, 11, 5], [8, 66, -17, 4], [92, 66, 17, 4]];
  const SHAPES = {
    nfl: `<defs><pattern id="tbChk" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#fff"/><rect width="8" height="8" fill="#111"/><rect x="8" y="8" width="8" height="8" fill="#111"/></pattern></defs>
      <circle cx="500" cy="165" r="135" fill="#e0262d"/><path d="M250 300a120 120 0 0 1 240 0z" fill="#f6c21c"/><path d="M560 300a140 140 0 0 1 280 0z" fill="#f6c21c"/>
      <rect x="110" y="120" width="120" height="120" fill="url(#tbChk)"/><rect x="760" y="90" width="150" height="110" fill="url(#tbChk)"/>
      <rect x="300" y="40" width="46" height="150" fill="#e0262d"/><rect x="660" y="30" width="46" height="170" fill="#f6c21c"/>
      <circle cx="170" cy="70" r="34" fill="#e0262d"/><circle cx="880" cy="250" r="50" fill="#e0262d"/><path d="M40 300a70 70 0 0 1 140 0z" fill="#111"/><rect x="930" y="150" width="50" height="50" fill="#111"/>`,
    nba: `<defs><radialGradient id="tbGlow" cx="50%" cy="100%" r="60%"><stop offset="0" stop-color="#ffd23a"/><stop offset=".55" stop-color="#ff7a1a" stop-opacity=".75"/><stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/></radialGradient></defs>
      <ellipse cx="500" cy="300" rx="430" ry="250" fill="url(#tbGlow)"/>
      <path d="M500 300L130 60l70 150z" fill="#1c3fd6"/><path d="M500 300L870 50l-60 170z" fill="#1c3fd6"/><path d="M500 300L20 250l120-70z" fill="#0f2aa8"/><path d="M500 300L980 240l-130-80z" fill="#0f2aa8"/>
      <path d="M500 300L330 10l90 40z" fill="#2f5cff"/><path d="M500 300L680 0l-80 60z" fill="#2f5cff"/>
      <g fill="#fff" opacity=".8"><rect x="60" y="40" width="90" height="3"/><rect x="170" y="52" width="40" height="3"/><rect x="760" y="30" width="120" height="3"/><rect x="820" y="46" width="50" height="3"/><rect x="420" y="18" width="70" height="3"/></g>`,
  };
  const artSeen = {};
  /* draw a banner once per set of players; a re-render of the page underneath leaves it alone */
  function banner(host, kind, players) {
    if (!host) return;
    const sig = kind + ":" + players.map(p => p.name).join("|");
    if (host.dataset.sig === sig) return;
    host.dataset.sig = sig;
    const collage = () => {
      if (host.dataset.sig !== sig) return;
      host.setAttribute("aria-label", (players[0].week ? "Week " + players[0].week + " top PPR scorers: " : "Featured this week: ") + players.map(p => p.name).join(", "));
      host.innerHTML = `<svg class="shapes" viewBox="0 0 1000 300" preserveAspectRatio="xMidYMax meet" aria-hidden="true">${SHAPES[kind]}</svg>` +
        players.slice(0, SLOTS.length).map((p, i) => { const [x, h, r, z] = SLOTS[i]; return `<img class="pl" alt="" src="${escHtml(p.img)}" style="--x:${x}%;--h:${h}%;--r:${r}deg;--z:${z};--d:${i * 45}ms" onerror="this.remove()">`; }).join("");
    };
    const art = () => { host.setAttribute("aria-label", "Featured players"); host.innerHTML = `<img class="art" alt="" src="media/banner/${kind}.png">`; };
    if (artSeen[kind] === true) return art();
    if (artSeen[kind] === false) return collage();

    DAL: ["#00538c", "#b8c4ca"], DEN: ["#0e2240", "#fec524"], DET: ["#c8102e", "#1d42ba"], GS: ["#1d428a", "#ffc72c"], HOU: ["#ce1141", "#c4ced4"], IND: ["#002d62", "#fdbb30"],
    LAC: ["#c8102e", "#1d428a"], LAL: ["#552583", "#fdb927"], MEM: ["#5d76a9", "#12173f"], MIA: ["#98002e", "#f9a01b"], MIL: ["#00471b", "#eee1c6"], MIN: ["#0c2340", "#78be20"],

    POR: ["#e03a3e", "#101820"], SAC: ["#5a2d81", "#63727a"], SA: ["#101820", "#c4ced4"], TOR: ["#ce1141", "#101820"], UTAH: ["#002b5c", "#f9a01b"], WSH: ["#002b5c", "#e31837"],

  function nflKit(team, home) {
    const k = KIT[team] || [(TEAM_META[team] || {}).color2 || "#ffd94a", (TEAM_META[team] || {}).color || "#24338c", "#ffffff", "#ffffff", "#ffffff"];
    const white = c => c.toLowerCase() === "#ffffff";
    return home ? { helmet: k[0], jersey: k[1], pants: k[2], num: k[3], trim: k[4], sock: k[1] }
      : { helmet: k[0], jersey: "#ffffff", pants: white(k[2]) ? k[1] : k[2], num: k[1], trim: k[4], sock: "#ffffff" };
  }
  function nbaKit(team, home) {
    const k = NBA_KIT[team] || ["#1c3fd6", "#ffd94a"];
    return home ? { helmet: k[0], jersey: k[0], pants: k[0], num: "#ffffff", trim: k[1], sock: "#ffffff" }
      : { helmet: k[0], jersey: "#ffffff", pants: "#ffffff", num: k[0], trim: k[0], sock: "#ffffff" };
  }

  /* Bobbleheads. The head is the player's own headshot, cut off at the neck and shrunk to sixteen
     sprite pixels across, so hair, beard, headband and skin are whatever the photo shows. Arms and
     legs take the colour of the middle of the face so they match it. */
  const HEAD_W = 12, lookCache = new Map();          /* chunky on purpose: a cartoon of the photo, not a copy */
  function readLook(url) {
    if (!url) return Promise.resolve(null);
    if (!lookCache.has(url)) lookCache.set(url, new Promise(res => {
      const im = new Image();
      im.crossOrigin = "anonymous";
      im.onerror = () => res(null);
      im.onload = () => {
        try {
          /* work at about a tenth of the photo: enough to find the head, cheap to scan */
          const W = 64, Hh = Math.max(24, Math.round(64 * im.naturalHeight / im.naturalWidth)), c = document.createElement("canvas"); c.width = W; c.height = Hh;
          const x = c.getContext("2d", { willReadFrequently: true });
          x.drawImage(im, 0, 0, W, Hh);
          const d = x.getImageData(0, 0, W, Hh).data, at = (px, py) => { const i = (py * W + px) * 4; return [d[i], d[i + 1], d[i + 2], d[i + 3]]; };
          const solid = (px, py) => px >= 0 && px < W && py >= 0 && py < Hh && d[(py * W + px) * 4 + 3] > 128;
          const dist = (p, q) => Math.abs(p[0] - q[0]) + Math.abs(p[1] - q[1]) + Math.abs(p[2] - q[2]);
          const lum = p => .3 * p[0] + .59 * p[1] + .11 * p[2];
          /* the middle half by brightness: drops both the shine on a forehead and a shadow */
          const mid = arr => { arr.sort((p, q) => lum(q) - lum(p)); const q = arr.length / 4 | 0, t = arr.slice(q, arr.length - q); return [0, 1, 2].map(k => t.reduce((sum, p) => sum + p[k], 0) / t.length); };

          if (top > Hh * .6) return res(null);

          const edge = py => { let a = cx, b = cx; while (solid(a - 1, py)) a--; while (solid(b + 1, py)) b++; return [a, b]; };

            gap = 0;
            for (let px = cx + 1; px < W; px++) { if (isSkin(px, py)) { b = px; gap = 0; } else if (++gap > 2) break; }

          for (let py = eye + Math.round(faceW * .8); py <= Math.min(Hh - 1, eye + Math.round(faceW * 1.25)); py++) { const [a, b] = edge(py), w = b - a; if (w < narrow) { narrow = w; neck = py; } }
          const beardRow = py => { let n = 0; for (let px = Math.round(mx) - 2; px <= Math.round(mx) + 2; px++) if (solid(px, py) && lum(at(px, py)) < lum(skin) * .62) n++; return n >= 4; };
          while (neck < Math.min(Hh - 1, eye + Math.round(faceW * 1.9)) && beardRow(neck + 1)) neck++;

          let half = faceW * .6;
          for (let py = top; py <= eye + Math.round(faceW * .3); py++) { const [a, b] = edge(py); half = Math.max(half, mx - a + 1, b - mx + 1); }

          const k = half * 2 / HEAD_W, rows = Math.min(23, Math.ceil((neck - top + 1) / k)), x0 = mx - half, sl = lum(skin), head = [];
          for (let j = 0; j < rows; j++) for (let i = 0; i < HEAD_W; i++) {
            const ya = Math.floor(top + j * k), yb = Math.max(ya + 1, Math.floor(top + (j + 1) * k)), xa = Math.floor(x0 + i * k), xb = Math.max(xa + 1, Math.floor(x0 + (i + 1) * k));
            const blk = []; let area = 0;
            for (let py = ya; py < yb; py++) for (let px = xa; px < xb; px++) { area++; if (solid(px, py)) blk.push(at(px, py)); }
            if (blk.length * 2 < area) continue;
            const col = [0, 1, 2].map(n => blk.reduce((t, q) => t + q[n], 0) / blk.length), y = (ya + yb) / 2, off = Math.abs((xa + xb) / 2 - mx);
            /* below the cheeks, anything out to the side that is not hair is a shoulder or a collar */

            head.push([i, j, col.map(v => Math.min(255, Math.round(v / 36) * 36))]);

        } catch (e) { res(null); }

    }));

  }

  /* Basketball players are drawn, not photographed: a clean pixel head whose hair, beard, headband,
     hair colour and skin are measured from the headshot. Skin is one of six steps, picked by how
     light the face is, so it is never the washed-out pink a studio flash gives. */
  const TONES = ["#f1c9a5", "#e0ac84", "#c68e63", "#a4704a", "#7d5237", "#563624"];
  const toneFor = lum => lum > 178 ? 0 : lum > 160 ? 1 : lum > 142 ? 2 : lum >= 124 ? 3 : lum > 100 ? 4 : 5;
  /* a few players whose headshot is lit so brightly that it reads too light: tone 1-6, by hand */
  const KNOWN_TONE = { "Kawhi Leonard": 5, "Coby White": 3, "Jaylen Brown": 5, "Donovan Mitchell": 5, "Anthony Edwards": 5 };
  /* football: how light the middle of the face is, on the same six steps; these headshots are lit
     darker than the NBA's, so they get a lift first */
  const toneCache = new Map();
  function readTone(url) {
    if (!url) return Promise.resolve(null);
    if (!toneCache.has(url)) toneCache.set(url, new Promise(res => {
      const im = new Image();
      im.crossOrigin = "anonymous";
      im.onerror = () => res(null);
      im.onload = () => {
        try {
          const n = 32, c = document.createElement("canvas"); c.width = c.height = n;
          const x = c.getContext("2d", { willReadFrequently: true });
          x.drawImage(im, 0, 0, n, n);
          const d = x.getImageData(11, 10, 10, 9).data, px = [];
          for (let i = 0; i < d.length; i += 4) if (d[i + 3] > 200) px.push(.3 * d[i] + .59 * d[i + 1] + .11 * d[i + 2]);
          if (px.length < 8) return res(null);
          px.sort((p, q) => q - p);

    }));

  }
  const styleCache = new Map();
  function readStyle(url) {
    if (!url) return Promise.resolve(null);
    if (!styleCache.has(url)) styleCache.set(url, new Promise(res => {
      const im = new Image();
      im.crossOrigin = "anonymous";
      im.onerror = () => res(null);
      im.onload = () => {
        try {
          const W = 60, Hh = 44, c = document.createElement("canvas"); c.width = W; c.height = Hh;
          const x = c.getContext("2d", { willReadFrequently: true });
          x.drawImage(im, 0, 0, W, Hh);
          const d = x.getImageData(0, 0, W, Hh).data, at = (px, py) => { const i = (py * W + px) * 4; return [d[i], d[i + 1], d[i + 2], d[i + 3]]; };
          const dist = (p, q) => Math.abs(p[0] - q[0]) + Math.abs(p[1] - q[1]) + Math.abs(p[2] - q[2]);
          const lum = p => .3 * p[0] + .59 * p[1] + .11 * p[2];
          /* the middle half by brightness: drops both the shine on a forehead and a shadow */
          const mid = arr => { arr.sort((p, q) => lum(q) - lum(p)); const q = arr.length / 4 | 0, t = arr.slice(q, arr.length - q); return [0, 1, 2].map(k => t.reduce((sum, p) => sum + p[k], 0) / t.length); };
          const face = [];
          for (let py = 14; py < 23; py++) for (let px = 25; px < 35; px++) { const q = at(px, py); if (q[3] > 200) face.push(q); }
          if (face.length < 8) return res(null);
          const skin = mid(face), sl = lum(skin), out = { tone: toneFor(sl), hair: "short", beard: 0, band: false };
          const cx = [28, 29, 30, 31]; let top = -1, fore = -1, run = 0;
          for (let py = 0; py < 26; py++) {
            const opaque = cx.map(px => at(px, py)).filter(q => q[3] > 200);
            if (top < 0) { if (opaque.length >= 3) top = py; else continue; }
            /* the hairline is where the middle of the head stops being dark; colour distance alone
               cannot tell dark hair from dark skin */
            if (opaque.filter(q => lum(q) > sl * .7 && dist(q, skin) < 120).length >= 3) { if (++run >= 2) { fore = py - 1; break; } } else run = 0;
          }
          if (top < 0 || fore < 0) return res(out);
          /* The widest run of skin across the face is ear to ear, at about eye level. Every other
             landmark is placed from that row and that width, so a full beard (which hides the chin)
             is still measured properly. */
          const isSkin = q => q[3] > 200 && dist(q, skin) < 90;
          const span = py => {
            let a = 29, b = 30, gap = 0;
            for (let px = 28; px >= 12; px--) { if (isSkin(at(px, py))) { a = px; gap = 0; } else if (++gap > 2) break; }
            gap = 0;
            for (let px = 31; px <= 47; px++) { if (isSkin(at(px, py))) { b = px; gap = 0; } else if (++gap > 2) break; }
            return [a, b];
          };
          let l = 29, r = 30, eye = fore + 4;
          for (let py = fore; py <= Math.min(Hh - 1, fore + 16); py++) { const [a, b] = span(py); if (b - a > r - l) { l = a; r = b; eye = py; } }
          const faceW = Math.max(10, Math.min(24, r - l + 1)), chin = Math.min(Hh - 1, eye + Math.round(faceW * .75)), jaw = eye + Math.round(faceW * .38);
          /* "Dark" is anything much darker than the skin: hair, brows, beard. */
          const isDark = q => q[3] > 200 && lum(q) < sl * .62, isPale = q => q[3] > 200 && lum(q) > sl * 1.2 && Math.max(q[0], q[1], q[2]) - Math.min(q[0], q[1], q[2]) < 55;
          const share = (xa, xb, ya, yb, f) => { let n = 0, t = 0; for (let py = Math.max(0, ya); py <= Math.min(Hh - 1, yb); py++) for (let px = Math.max(0, xa); px <= Math.min(W - 1, xb); px++) { t++; if (f(at(px, py))) n++; } return t ? n / t : 0; };
          const mx = Math.round((l + r) / 2), half = Math.round(faceW / 2), tall = (fore - top) / faceW, above = [];
          for (let py = top; py < fore; py++) for (let px = mx - 2; px <= mx + 2; px++) { const q = at(px, py); if (isDark(q)) above.push(q); }
          /* hair spreading past the face on each side, and hair hanging beside it from eyes to jaw */
          const wide = share(l - Math.round(faceW * .45), l - 2, top, fore + 3, isDark) + share(r + 2, r + Math.round(faceW * .45), top, fore + 3, isDark);
          const hang = share(l - Math.round(faceW * .4), l - 2, eye + 2, jaw, isDark) + share(r + 2, r + Math.round(faceW * .4), eye + 2, jaw, isDark);
          /* bald only when the very top of the head is plainly skin; a close crop on dark skin is short hair */
          const crown = [];
          for (let py = top; py <= top + 1; py++) for (const px of cx) { const q = at(px, py); if (q[3] > 200) crown.push(q); }
          const bare = crown.length >= 4 && tall < .08 && crown.every(q => dist(q, skin) < 50 && lum(q) > sl * .92);
          out.hair = bare ? "bald" : hang > .9 ? "locs" : tall > .42 && wide > .7 ? "afro" : tall > .3 ? "medium" : "short";
          /* a beard is dark from the cheeks to the chin; a big one keeps going below it */
          const jawDark = share(mx - Math.round(faceW * .3), mx + Math.round(faceW * .3), jaw, chin, isDark), below = share(mx - Math.round(faceW * .25), mx + Math.round(faceW * .25), chin + 1, chin + 5, isDark);
          out.beard = jawDark > .6 && below > .5 ? 2 : jawDark > .33 ? 1 : 0;
          out.band = share(mx - half, mx + half, Math.max(top, fore - 5), fore, isPale) > .3;
          /* hair colour, when there is enough of it to read; kept dark so glare never turns it grey */
          const dk = above.length >= 8 ? mid(above) : null;
          if (dk) { const f = Math.min(.85, 62 / Math.max(1, lum(dk))); out.color = `rgb(${dk.map(v => Math.max(16, Math.round(v * f))).join(",")})`; }
          res(out);
        } catch (e) { res(null); }
      };
      im.src = url;
    }));
    return styleCache.get(url);
  }

  function pixelPlayers() {
    for (const pm of document.querySelectorAll("button.pm")) {
      const av = pm.querySelector(".avatar");
      if (!av || av.classList.contains("pix")) continue;
      const nba = pm.dataset.sport === "nba", img = av.querySelector("img"), shot = img && img.src;
      const pos = (pm.querySelector(".pm-pos") || {}).textContent, name = pm.getAttribute("title") || "";
      let kit, logo;
      if (nba) {
        const g = NBA.data && (NBA.data.games || []).find(x => String(x.game_id) === String(NBA.arg));
        const side = (document.querySelector('#nbaBody [data-nba-side][aria-pressed="true"]') || { dataset: {} }).dataset.v === "home" ? "home" : "away";
        const who = NBA.data && (NBA.data.players || []).find(x => String(x.player_id) === String(pm.dataset.pcard));
        const team = g ? g[side].abbr : who && who.team;
        kit = nbaKit(team, side === "home"); logo = team;
      } else {
        const sec = pm.closest(".rostersec") || document, tab = sec.querySelector('.teamtab[data-k="team"][aria-pressed="true"]');
        const team = tab && tab.dataset.v, g = tab && (DATA.games || []).find(x => x.game_id === tab.dataset.lu);
        kit = nflKit(team, !g || g.home_team === team); logo = team;
      }
      for (const k in kit) pm.style.setProperty("--pix-" + k, kit[k]);
      /* the offensive line sets up as a wedge: centre on the ball, guards a step back, tackles a step behind them */
      if (!nba) {
        const P = String(pos || "").toUpperCase().trim(), back = /^(LG|RG|G|OG)\b/.test(P) ? 3.5 : /^(LT|RT|T|OT)\b/.test(P) ? 7 : 0;
        if (back && pm.style.top.endsWith("%")) pm.style.top = (parseFloat(pm.style.top) + back) + "%";
      }
      const stance = stanceFor(nba ? "nba" : "nfl", pos);
      /* two-letter codes go on whole (NE, KC, NY); longer ones by their first letter */
      const mark = !logo ? "" : logo.length <= 2 ? logo : logo[0];
      av.className = "avatar pix";
      if (nba) {
        /* basketball: a bobblehead, the player's own head from the whole headshot */
        const draw = seen => {
          if (seen) pm.style.setProperty("--pix-skin", `rgb(${seen.skin.join(",")})`);
          av.innerHTML = sprite(stance, seen ? { mark: mark, head: seen.head, rows: seen.rows } : { mark: mark, hair: "short" });
        };
        draw(null);
        readLook(shot).then(seen => { if (seen && av.isConnected) draw(seen); });
      } else {
        /* football: the helmeted sprite; only the skin tone comes from the headshot */
        av.innerHTML = sprite(stance, { mark: mark });
        readTone(shot).then(tone => { if (tone != null) pm.style.setProperty("--pix-skin", TONES[tone]); });
      }
    }
  }
  let pixQueued = false;
  new MutationObserver(() => { if (pixQueued) return; pixQueued = true; requestAnimationFrame(() => { pixQueued = false; pixelPlayers(); }); })
    .observe(document.querySelector("main"), { childList: true, subtree: true });
  route();
})();
